name: NewtonCoach
options:
  bundleIdPrefix: uk.daniellimon
  deploymentTarget:
    iOS: "16.0"
targets:
  NewtonCoach:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NewtonCoach
    info:
      path: NewtonCoach/Info.plist
    settings:
      base:
        PRODUCT_NAME: NewtonCoach
        PRODUCT_BUNDLE_IDENTIFIER: uk.daniellimon.NewtonCoach
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NewtonCoach/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
